<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${item.name} ?: 'Товар'">Товар</title>

    <style>
        :root{
            --bg: rgb(246, 247, 251);--card:#fff;--muted:#6b7280;--text:#0f172a;--line: rgb(229, 231, 235);
            --primary:#111827;--accent:#2563eb;--chip-bg:#f1f5f9;--chip-bd:#e2e8f0;--chip-tx:#334155;
            --ok:#065f46;--low:#b91c1c;--shadow:0 10px 20px rgba(2,6,23,.06),0 2px 6px rgba(2,6,23,.04);
            --radius:16px;
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{
            font-family: ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
            color:var(--text);
            background:
                    radial-gradient(1100px 520px at -10% -10%, #e8edff 0, rgba(232,237,255,0) 60%),
                    radial-gradient(900px 500px at 110% -20%, #ffe8ef 0, rgba(255,232,239,0) 55%),
                    var(--bg);
        }
        .container{max-width:1100px;margin:0 auto;padding:28px 20px 40px}
        a{color:var(--accent);text-decoration:none}
        a:hover{text-decoration:underline}

        .grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
        @media (max-width:1024px){.grid{grid-template-columns:1fr}}
        .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
        .pad{padding:22px}
        .mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}.mb24{margin-bottom:24px}
        .title{margin:0 0 6px;font-size:28px;line-height:1.2}
        .muted{color:var(--muted)}
        .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
        .between{display:flex;justify-content:space-between;align-items:center;gap:12px}

        .chips{display:flex;flex-wrap:wrap;gap:8px}
        .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--chip-bd);background:var(--chip-bg);
            color:var(--chip-tx);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
        .badge{display:inline-flex;align-items:center;gap:6px;background:#fff7ed;color:#b45309;border:1px solid #fdba74;
            border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700}

        .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:#eef2ff;border:1px solid var(--line)}

        .price-lg{font-size:32px;font-weight:800;letter-spacing:.2px}
        .price-old{color:#94a3b8;text-decoration:line-through;margin-left:10px}
        .stock{font-weight:700}.stock.low{color:var(--low)}.stock.ok{color:var(--ok)}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 16px;border-radius:12px;
            border:1px solid var(--primary);background:var(--primary);color:#fff;font-weight:700;cursor:pointer;
            transition:.2s transform,.2s box-shadow}
        .btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(15,23,42,.18)}
        .btn:disabled{opacity:.55;cursor:not-allowed}
        .btn.ghost{background:#fff;color:var(--primary);border-color:var(--line)}
        .btn.ghost:hover{box-shadow:var(--shadow)}
        .input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit}
        textarea{min-height:92px;resize:vertical}
        .hr{height:1px;background:var(--line);margin:18px 0}
        .revs{display:grid;gap:12px}
        .rev{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
        .avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
            font-weight:800;background:#dbeafe;color:#1e3a8a;border:1px solid #bfdbfe}
        .stars{white-space:nowrap}
        .sticky{position:sticky;top:18px}

        /* NEW: перенос длинных отзывов и сохранение переводов строк */
        .rev p{
            word-break: break-word;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
        }
    </style>

    <!-- ДОБАВКИ: тёмная тема + адаптивность для мобильных (не меняют светлую тему) -->
    <style>
        /* ===== ТЁМНАЯ ТЕМА (активируется классом .dark на <body>) */
        body.dark{
            /* фон страницы для тёмной темы — ровный чёрный */
            background:#000 !important;
            color:#e5e7eb;
        }
        /* переопределяем переменные под тёмную */
        body.dark{
            --bg:#000000;
            --card:#0f172a;
            --text:#e5e7eb;
            --muted:#a3a3a3;
            --line:rgba(148,163,184,.22);
            --primary:#111827;
            --accent:#c4b5fd;
            --chip-bg:#0b1220;
            --chip-bd:rgba(148,163,184,.32);
            --chip-tx:#e5e7eb;
            --shadow:0 12px 28px rgba(0,0,0,.45);
        }

        /* элементы, у которых были жёстко светлые фоны — делаем тёмными */
        body.dark .btn.ghost{ background:transparent; color:#e5e7eb; border-color:var(--line); }
        body.dark .input, body.dark select, body.dark textarea{
            background:#0b1220; color:#e5e7eb; border-color:var(--line);
        }
        body.dark .badge{ background:#1f2433; color:#ffd8a8; border-color:#664d2c; }
        body.dark .thumb{ background:#0b1220; border-color:var(--line); }
        body.dark .rev{ background:var(--card); border-color:var(--line); }
        body.dark a{ color:var(--accent); }

        /* цены на тёмной теме — контрастные */
        body.dark .price-lg{ color:#ffffff; }
        body.dark .price-old{ color:#cbd5e1; }

        /* ===== ДОП. АДАПТИВНОСТЬ (добавка к твоей сетке) ===== */
        @media (max-width: 768px){
            .container{ padding:24px 16px 36px; }
            .title{ font-size:24px; }
            .price-lg{ font-size:28px; }
            .between{ gap:10px; }
            /* формы отзывов: в столбик и кликабельные кнопки */
            .row.wrap-md{ flex-direction:column; align-items:stretch; gap:12px; }
            .btn.full{ width:100%; }
        }
        @media (max-width: 480px){
            .container{ padding:22px 14px 34px; }
            .title{ font-size:22px; }
            .price-lg{ font-size:26px; }
        }
        /* === Выровнять стиль карточек на странице товара под карточки каталога === */

        /* Лёгкая анимация и та же «карточная» тень */
        .card {
            border-radius: 14px;
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            transition: transform .15s ease, box-shadow .25s ease;
        }
        .card:hover { transform: translateY(-2px); }

        /* Заголовки и подзаголовки читаемее */
        .title { color: var(--text); }      /* светлая тема как была */
        h2 { color: var(--text); }

        /* ---- Тёмная тема (как в каталоге) ---- */
        body.dark{
            --card:#0f172a;
            --line: rgba(148,163,184,.20);
            --text:#e5e7eb;
            --muted:#cbd5e1;                  /* менее бледные подписи */
        }

        body.dark .card{
            background:#0f172a;
            border-color:rgba(148,163,184,.20);
            box-shadow:0 8px 24px rgba(0,0,0,.45);
            color:#e5e7eb;
        }
        body.dark .title,
        body.dark h2 { color:#ffffff; }     /* заголовки ярче, как в каталоге */

        body.dark .thumb{
            background:#0b1220;
            border-color:rgba(148,163,184,.25);
        }

        /* Чипы/бейджи как в каталоге */
        body.dark .chip{
            background:#0b1220;
            border-color:rgba(148,163,184,.28);
            color:#e5e7eb;
        }
        body.dark .badge{
            background:#1f2433;
            border-color:#664d2c;
            color:#ffd8a8;
        }

        /* Инпуты и текстовые поля */
        body.dark .input,
        body.dark select,
        body.dark textarea{
            background:#0b1220;
            color:#e5e7eb;
            border-color:rgba(148,163,184,.28);
        }
        body.dark .input:focus,
        body.dark select:focus,
        body.dark textarea:focus{
            outline:0;
            border-color:#8b5cf6;
            box-shadow:0 0 0 3px rgba(139,92,246,.25);
        }

        /* Кнопки как в каталоге */
        body.dark .btn{
            background:#111827;
            border-color:#111827;
            color:#fff;
        }
        body.dark .btn:hover{
            transform: translateY(-1px);
            box-shadow:0 8px 20px rgba(0,0,0,.35);
        }
        body.dark .btn.ghost{
            background:transparent;
            color:#e5e7eb;
            border-color:rgba(148,163,184,.28);
        }

        /* Карточки отзывов — те же цвета, что у карточек товара */
        body.dark .rev{
            background:#0f172a;
            border-color:rgba(148,163,184,.22);
        }
        /* ===== Светлая / Тёмная тема для фона страницы ===== */
        body {
            background-color: #f9fafb;    /* светлая тема по умолчанию */
            color: #111827;               /* обычный текст */
        }

        /* когда включена тёмная тема */
        body.dark {
            background-color: #0b1220;    /* тёмный фон (как в каталоге) */
            color: #e5e7eb;               /* светлый текст */
        }

        /* карточки в светлой теме */
        body:not(.dark) .card {
            background: #fff;
            color: #111827;
            border: 1px solid #e5e7eb;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
        }

    </style>

    <!-- Автоприменение сохранённой темы (если в хедере есть переключатель) -->
    <script>
        (function(){
            try{
                var t = localStorage.getItem('theme');
                if(t === 'dark'){ document.body.classList.add('dark'); }
            }catch(e){}
        })();
    </script>
</head>

<body>

<div th:replace="fragments/header :: header"></div>

<section>
    <div class="container">
        <a href="/products" class="muted">← Назад в каталог</a>

        <div class="grid">
            <!-- ЛЕВАЯ КОЛОНКА -->
            <aside class="card pad sticky">
                <h1 class="title" th:text="${item.name}">Товар</h1>

                <div class="chips mb12">
                    <span class="chip" th:text="${item.categoryName}">Категория</span>
                    <span class="badge" th:if="${item.isPromotional}">Акция</span>
                </div>

                <div class="mb12">
          <span class="price-lg"
                th:text="${#numbers.formatDecimal(item.priceFinal,1,'COMMA',2,'POINT')} + ' ₽'">0,00 ₽</span>
                    <span class="price-old"
                          th:if="${item.discountPercent != null and item.discountPercent > 0}"
                          th:text="${#numbers.formatDecimal(item.price,1,'COMMA',2,'POINT')} + ' ₽'">0,00 ₽</span>
                </div>

                <div class="mb16"
                     th:with="qty=${item.stockQty != null ? item.stockQty : 0}"
                     th:classappend="${qty <= 3} ? ' stock low' : ' stock ok'">
                    <span class="muted">Остаток:</span>
                    <span th:text="${qty} + ' шт'">0 шт</span>
                </div>

                <form th:action="@{/cart/add}" method="post" class="mb16">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="productId" th:value="${item.productId}"/>

                    <label class="muted mb8" for="qty" style="display:block">Количество</label>
                    <input id="qty" class="input mb12" type="number" name="qty" value="1" min="1"
                           th:attr="max=${item.stockQty}"/>

                    <button class="btn" th:disabled="${item.stockQty == null or item.stockQty == 0}">
                        🛒 В корзину
                    </button>
                </form>

                <div class="chips">
                    <span class="chip">ID: <span th:text="${item.productId}">0</span></span>
                    <span class="chip" th:if="${item.avgRating != null}">
            ★ <span th:text="${item.avgRating}">0</span> / 5
          </span>
                    <span class="chip" th:if="${item.reviewsCount != null}"
                          th:text="${item.reviewsCount} + ' отзыв(ов)'">0 отзывов</span>
                </div>
            </aside>

            <!-- ПРАВАЯ КОЛОНКА -->
            <div class="card pad">
                <a th:href="@{|/products/${item.productId}/image|}" target="_blank" rel="noopener">
                    <img class="thumb mb20" th:src="@{|/products/${item.productId}/image|}" alt="image" title="Открыть в полном размере"/>
                </a>
                <div class="mb20">
                    <div class="muted mb8">Описание</div>
                    <p style="margin:0" th:text="${item.description}">Описание товара…</p>
                </div>

                <div th:if="${specs != null}">
                    <div class="muted mb8">Характеристики</div>
                    <div style="display:grid;grid-template-columns:180px 1fr;gap:8px 18px">
                        <div class="muted" th:each="s : ${specs}" th:text="${s.key}">Параметр</div>
                        <div th:each="s : ${specs}" th:text="${s.value}">Значение</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ОТЗЫВЫ -->
        <div class="card pad mb24" style="margin-top:24px">
            <div class="between mb12">
                <h2 style="margin:0;font-size:22px">Отзывы</h2>
                <a href="#reviews" class="chip"
                   th:text="${(reviews == null) ? 0 : #lists.size(reviews)} + ' шт'">0 шт</a>
            </div>

            <!-- Форма -->
            <div class="mb20">
                <form th:action="@{|/products/${item.productId}/reviews/save|}" method="post">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="row wrap-md" style="gap:16px;">
                        <div style="min-width:160px;flex:0 0 200px">
                            <label class="muted mb8" style="display:block">Оценка</label>
                            <select name="rating" class="input" required>
                                <option th:selected="${myReview != null and myReview.rating == 1}" value="1">★☆☆☆☆</option>
                                <option th:selected="${myReview != null and myReview.rating == 2}" value="2">★★☆☆☆</option>
                                <option th:selected="${myReview != null and myReview.rating == 3}" value="3">★★★☆☆</option>
                                <option th:selected="${myReview != null and myReview.rating == 4}" value="4">★★★★☆</option>
                                <option th:selected="${myReview != null and myReview.rating == 5}" value="5">★★★★★</option>
                            </select>
                        </div>

                        <div style="flex:1 1 420px">
                            <label class="muted mb8" style="display:block">Комментарий</label>

                            <textarea class="input" name="comment" rows="3" maxlength="300"
                                      th:text="${myReview != null ? myReview.comment : ''}"
                                      placeholder="Поделитесь впечатлениями… (до 300 символов)"></textarea>
                            <div class="muted" style="margin-top:4px">До 300 символов</div>
                        </div>
                    </div>

                    <div class="row" style="gap:8px;margin-top:12px">
                        <button type="submit" class="btn">💬 Сохранить отзыв</button>
                        <button th:if="${myReview != null}"
                                th:formaction="@{|/products/${item.productId}/reviews/delete|}"
                                formmethod="post"
                                class="btn ghost">🗑 Удалить</button>
                    </div>
                </form>
            </div>

            <div class="hr"></div>

            <!-- Список -->
            <div class="revs" id="reviews">
                <div class="rev" th:each="r : ${reviews}">
                    <div class="between">
                        <div class="row">
                            <div class="avatar" th:text="${#strings.substring(r.userName,0,1)}">U</div>
                            <strong th:text="${r.userName}">User</strong>
                            <span class="stars" style="margin-left:6px">
                <span th:utext="${#strings.repeat('★', (r.rating == null ? 0 : r.rating.intValue()))}"></span>
                <span class="muted"
                      th:utext="${#strings.repeat('☆', 5 - (r.rating == null ? 0 : r.rating.intValue()))}"></span>
              </span>
                        </div>
                        <time class="muted"
                              th:text="${#temporals.format(r.createdAt.plusHours(3), 'dd.MM.yyyy HH:mm')}">дата</time>
                    </div>
                    <p style="margin:10px 0 0" th:text="${r.comment}">Комментарий…</p>
                </div>
            </div>
        </div>

        <div class="between">
            <a href="/products" class="btn ghost">← В каталог</a>
            <a href="#top" class="chip">Наверх ↑</a>
        </div>
    </div>

</section>

<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
