<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title>Каталог</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <style>
        .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
        .toolbar input, .toolbar select{padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px}
        .btn{padding:8px 12px;border-radius:8px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
        .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;overflow:hidden}
    </style>
</head>
<body>
<div class="container">
    <h1>Каталог</h1>

    <!-- Панель поиска/фильтра -->
    <form class="toolbar" method="get" th:action="@{/products}">
        <input type="text" name="q" placeholder="Поиск по названию/описанию"
               th:value="${q}"/>

        <select name="cat">
            <option th:value="0"
                    th:selected="${cat == null or cat == 0}">Все категории</option>
            <option th:each="c : ${categories}"
                    th:value="${c.id}"
                    th:text="${c.name}"
                    th:selected="${cat != null and cat == c.id}">Категория</option>
        </select>

        <button class="btn" type="submit">Найти</button>

        <a class="btn" th:href="@{/products}" style="background:#fff;color:#111827;border-color:#e5e7eb">Сброс</a>
    </form>

    <!-- Пусто -->
    <div th:if="${#lists.isEmpty(items)}" class="muted">Пока нет товаров.</div>

    <!-- Список карточек -->
    <div th:if="${!#lists.isEmpty(items)}" class="grid">

        <div class="card" th:each="item : ${items}">
            <a th:href="@{|/products/${item.productId}|}">
                <img th:src="@{|/products/${item.productId}/image|}" alt=""
                     style="width:100%;aspect-ratio:4/3;object-fit:cover;background:#f3f4f6">
            </a>

            <div style="padding:12px">
                <a th:href="@{|/products/${item.productId}|}" th:text="${item.name}"
                   style="display:block;font-weight:600;margin-bottom:6px">Название товара</a>

                <div style="color:#6b7280;font-size:12px;margin-bottom:6px"
                     th:text="${item.categoryName}">Категория</div>

                <div style="display:flex;align-items:center;gap:8px">
                    <span th:text="${#numbers.formatDecimal(item.priceFinal,1,'COMMA',2,'POINT')} + ' ₽'"
                          style="font-weight:800"></span>
                    <span th:if="${item.isPromotional != null and item.isPromotional}"
                          th:text="${#numbers.formatDecimal(item.price,1,'COMMA',2,'POINT')} + ' ₽'"
                          style="color:#9ca3af;text-decoration:line-through"></span>
                </div>

                <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
                    <small>
                        Остаток:
                        <span th:text="${item.stockQty != null ? item.stockQty : 0}">0</span> шт
                    </small>

                    <form th:action="@{/cart/add}" method="post" style="margin:0">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="productId" th:value="${item.productId}">
                        <input type="hidden" name="qty" value="1">
                        <button type="submit" class="btn"
                                th:disabled="${item.stockQty == null or item.stockQty == 0}">🛒 В корзину</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
