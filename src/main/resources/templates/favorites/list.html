<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Избранное</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</head>
<body>
<div class="container">
    <h1>Избранное</h1>

    <div th:if="${ok}" class="card" th:text="${ok}"></div>

    <div th:if="${#lists.isEmpty(products)}" class="muted">Пока пусто.</div>

    <div th:if="${!#lists.isEmpty(products)}"
         class="grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">

        <div class="card" th:each="p : ${products}"
             style="border:1px solid #e5e7eb;border-radius:12px;background:#fff;overflow:hidden">
            <a th:href="@{|/products/${p.productId}|}">
                <img th:src="@{|/products/${p.productId}/image|}" alt=""
                     style="width:100%;aspect-ratio:4/3;object-fit:cover;background:#f3f4f6">
            </a>

            <div style="padding:12px">
                <a th:href="@{|/products/${p.productId}|}" th:text="${p.name}"
                   style="display:block;font-weight:600;margin-bottom:6px">Название</a>

                <div style="display:flex;align-items:center;gap:8px">
          <span th:text="${#numbers.formatDecimal(p.priceFinal,1,'COMMA',2,'POINT')} + ' ₽'"
                style="font-weight:800"></span>
                </div>

                <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
                    <form th:action="@{/favorites/remove}" method="post" style="margin:0">
                        <input type="hidden" name="productId" th:value="${p.productId}">
                        <button type="submit" class="btn ghost">✖ Удалить</button>
                    </form>
                    <a class="btn" th:href="@{|/products/${p.productId}|}">Открыть</a>
                </div>
            </div>
        </div>
    </div>

    <div style="margin-top:16px;display:flex;gap:8px">
        <a class="btn ghost" th:href="@{/products}">← В каталог</a>
        <form th:action="@{/favorites/clear}" method="post">
            <button class="btn ghost" type="submit">Очистить</button>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
