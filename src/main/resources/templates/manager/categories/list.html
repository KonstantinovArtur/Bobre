<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Категории — менеджер</title>

    <!-- Хедер-фрагмент -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- Мгновенное применение сохранённой темы -->
    <script>
        (function(){try{
            if(localStorage.getItem('theme')==='dark'){ document.body.classList.add('dark'); }
        }catch(e){}})();
    </script>

    <!-- БАЗОВЫЕ СТИЛИ (светлая тема как было) -->
    <style>
        body{ background:#f8fafc; margin:0; }
        .page-wrap{max-width:980px;margin:24px auto;padding:0 16px}

        .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:16px;margin:16px 0;
            box-shadow:0 2px 6px rgba(0,0,0,.05)}

        table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
        th,td{padding:10px;border-bottom:1px solid #eee;text-align:left}
        thead th{background:#f8fafc;color:#374151;font-weight:600}

        .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
        .btn{padding:8px 12px;border-radius:8px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer}
        .btn.ghost{background:#fff;color:#111827;border:1px solid #e5e7eb}
        input{padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font:inherit}

        .alert{padding:12px 14px;border-radius:10px;margin:12px 0;font-weight:600}
        .alert.error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
        .alert.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
        .help{font-size:.9rem;color:#b91c1c;margin-top:6px}

        /* АДАПТИВНОСТЬ */
        .table-wrap{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}
        .table-scroll{overflow-x:auto}
        @media (max-width: 720px){
            .page-wrap{padding:0 12px}
            th,td{padding:8px}
            input{min-width:0;width:100%}
            .btn,.btn.ghost{white-space:nowrap}
        }
        @media (max-width: 480px){
            .btn,.btn.ghost{width:100%}
            .row{gap:6px}
        }
    </style>

    <!-- ТЁМНАЯ ТЕМА: карточки, инпуты, таблица, фон -->
    <style>
        body.dark{ background:#000; color:#e5e7eb; }

        body.dark .card{
            background:#0f172a !important;
            border-color:rgba(148,163,184,.22) !important;
            color:#e5e7eb;
            box-shadow:0 8px 24px rgba(0,0,0,.45);
        }

        body.dark input{
            background:#0b1220; color:#e5e7eb; border-color:rgba(148,163,184,.28);
        }
        body.dark input:focus{
            outline:0; border-color:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.25);
        }

        body.dark .btn{ background:#111827; border-color:#111827; color:#fff; }
        body.dark .btn.ghost{
            background:transparent; color:#e5e7eb; border-color:rgba(148,163,184,.28);
        }

        body.dark .alert.ok{
            background:#052e1f; border-color:#166534; color:#d1fae5;
        }
        body.dark .alert.error{
            background:#3b0a0a; border-color:#7f1d1d; color:#fee2e2;
        }
        body.dark .help{ color:#fca5a5; }

        /* Таблица в тёмной теме */
        body.dark table{ background:#0f172a; color:#e5e7eb; }
        body.dark thead th{ background:#111827; color:#e5e7eb; }
        body.dark th, body.dark td{ border-bottom:1px solid rgba(148,163,184,.22); }
        body.dark .table-wrap{ border-color:rgba(148,163,184,.22); }
    </style>
</head>
<body>

<div class="page-wrap">
    <h1>Категории</h1>

    <!-- флеши -->
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${ok}" class="alert ok" th:text="${ok}"></div>

    <!-- Добавить -->
    <div class="card">
        <h3>Добавить категорию</h3>
        <form th:action="@{/manager/categories/create}" method="post" class="row" style="margin-top:8px">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input name="name" placeholder="Название категории" required/>
            <button class="btn" type="submit">Добавить</button>
        </form>
        <div class="help"
             th:if="${param.name != null}"
             th:text="'Название должно начинаться с буквы, 3–25 символов.'"></div>
    </div>

    <!-- Список -->
    <div class="card">
        <h3>Список</h3>

        <div class="table-wrap">
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr><th>ID</th><th>Название</th><th>Действия</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${items}">
                        <td th:text="${c.id}">1</td>
                        <td>
                            <form th:action="@{|/manager/categories/${c.id}/update|}" method="post" class="row" style="margin:0">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <input name="name" th:value="${c.name}" required style="min-width:260px"/>
                                <button class="btn" type="submit">Сохранить</button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{|/manager/categories/${c.id}/delete|}" method="post" style="margin:0"
                                  onsubmit="return confirm('Удалить категорию?')">
                                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button class="btn.ghost btn ghost" type="submit">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <a class="btn ghost" th:href="@{/}">← На главную</a>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
