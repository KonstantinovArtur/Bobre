<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${isEdit} ? ('Редактирование адреса #' + ${form.id}) : 'Новый адрес'">Адрес</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
    <style>
        .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:16px}
        label{display:block;margin:8px 0 4px}
        input,textarea{width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px}
        .row{display:flex;gap:12px;flex-wrap:wrap}
        .col{flex:1}
        .btn{padding:10px 14px;border-radius:8px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer}
        .btn.ghost{background:#fff;color:#111827}
        .muted{color:#6b7280}
        .error{color:#b91c1c;margin-top:6px;font-size:.9rem}
        .field-error{border-color:#fca5a5;background:#fef2f2}
        .alert{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px;margin-bottom:12px}
    </style>
</head>
<body>
<div class="container" style="max-width:700px;margin:20px auto">
    <h1 th:text="${isEdit} ? ('Редактирование адреса #' + ${form.id}) : 'Новый адрес'">Адрес</h1>

    <div class="card">
        <!-- ВАЖНО: используем th:object, чтобы работал #fields и th:errors -->
        <form th:action="${isEdit} ? @{|/manager/addresses/${form.id}/update|} : @{/manager/addresses/create}"
              th:object="${form}"
              method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Общая сводка ошибок формы (если есть глобальные/полевая валидация) -->
            <div th:if="${#fields.hasAnyErrors()}" class="alert">
                Пожалуйста, исправьте ошибки ниже.
            </div>

            <!-- Строка адреса -->
            <label for="addressLine">Адрес (address_line)</label>
            <textarea id="addressLine"
                      th:field="*{addressLine}"
                      rows="3"
                      placeholder="г. Москва, Красная пл., 1"
                      th:classappend="${#fields.hasErrors('addressLine')} ? ' field-error'">
            </textarea>
            <div class="muted">Хранится как одна строка (поле <code>address_line</code>).</div>
            <div class="error" th:if="${#fields.hasErrors('addressLine')}"
                 th:errors="*{addressLine}">Ошибка адреса</div>

            <!-- Стоимость доставки -->
            <div class="row" style="margin-top:10px">
                <div class="col">
                    <label for="shippingCost">Стоимость доставки, ₽</label>
                    <input id="shippingCost"
                           type="number" step="0.01" min="0"
                           th:field="*{shippingCost}"
                           th:classappend="${#fields.hasErrors('shippingCost')} ? ' field-error'"/>
                    <div class="error" th:if="${#fields.hasErrors('shippingCost')}"
                         th:errors="*{shippingCost}">Ошибка стоимости доставки</div>
                </div>
            </div>

            <div class="row" style="margin-top:16px">
                <button class="btn" type="submit">Сохранить</button>
                <a class="btn ghost" th:href="@{/manager/addresses}">Отмена</a>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
