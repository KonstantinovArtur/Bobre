<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? ('Редактирование адреса #' + ${form.id}) : 'Новый адрес'">Адрес</title>

    <!-- Хедер -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- Мгновенное применение сохранённой темы -->
    <script>
        (function(){try{
            if(localStorage.getItem('theme')==='dark'){ document.body.classList.add('dark'); }
        }catch(e){}})();
    </script>

    <!-- Светлая тема (как было), но БЕЗ .container -->
    <style>
        .page-wrap{max-width:700px;margin:20px auto;padding:0 16px}
        h1{margin:0 0 12px}

        .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
        label{display:block;margin:8px 0 4px}
        input,textarea{width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;font:inherit}
        textarea{min-height:92px;resize:vertical}
        .row{display:flex;gap:12px;flex-wrap:wrap}
        .col{flex:1}
        .btn{padding:10px 14px;border-radius:8px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer;transition:.15s}
        .btn:hover{transform:translateY(-1px)}
        .btn.ghost{background:#fff;color:#111827;border:1px solid #d1d5db}
        .muted{color:#6b7280}
        .error{color:#b91c1c;margin-top:6px;font-size:.9rem}
        .field-error{border-color:#fca5a5;background:#fef2f2}
        .alert{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px;margin-bottom:12px}

        @media (max-width:560px){
            .btn,.btn.ghost{width:100%}
            .row{gap:10px}
        }
    </style>

    <!-- Тёмная тема (совместима с остальными страницами) -->
    <style>
        body.dark{ background:#000; color:#e5e7eb; }

        body.dark .card{
            background:#0f172a !important;
            border-color:rgba(148,163,184,.22) !important;
            color:#e5e7eb;
            box-shadow:0 8px 24px rgba(0,0,0,.45);
        }

        body.dark input,
        body.dark textarea{
            background:#0b1220;
            color:#e5e7eb;
            border-color:rgba(148,163,184,.28);
        }
        body.dark input:focus,
        body.dark textarea:focus{
            outline:0;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.25);
        }

        body.dark .muted{ color:#a3a3a3 !important; }
        body.dark .btn{ background:#111827; border-color:#111827; color:#fff; }
        body.dark .btn.ghost{ background:transparent; color:#e5e7eb; border-color:rgba(148,163,184,.28); }
        body.dark .alert{ background:#3b0a0a; border-color:#7f1d1d; color:#fee2e2; }
        body.dark .field-error{ background:#1a0f12; border-color:#ef4444; }
    </style>
</head>

<body>
<div class="page-wrap">
    <h1 th:text="${isEdit} ? ('Редактирование адреса #' + ${form.id}) : 'Новый адрес'">Адрес</h1>

    <div class="card">
        <form th:action="${isEdit} ? @{|/manager/addresses/${form.id}/update|} : @{/manager/addresses/create}"
              th:object="${form}" method="post">
            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div th:if="${#fields.hasAnyErrors()}" class="alert">Пожалуйста, исправьте ошибки ниже.</div>

            <label for="addressLine">Адрес (address_line)</label>
            <textarea id="addressLine" th:field="*{addressLine}" rows="3"
                      placeholder="г. Москва, Красная пл., 1"
                      th:classappend="${#fields.hasErrors('addressLine')} ? ' field-error'"></textarea>
            <div class="muted">Хранится как одна строка (поле <code>address_line</code>).</div>
            <div class="error" th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}"></div>



            <div class="row" style="margin-top:16px">
                <button class="btn" type="submit">Сохранить</button>
                <a class="btn ghost" th:href="@{/manager/addresses}">Отмена</a>
            </div>
        </form>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
