<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Адреса доставки</title>

    <!-- Хедер -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- Мгновенно применяем сохранённую тему (без «мигания») -->
    <script>
        (function(){
            try {
                if(localStorage.getItem('theme') === 'dark'){
                    document.body.classList.add('dark');
                }
            } catch(e){}
        })();
    </script>

    <!-- ОСНОВНОЙ СТИЛЬ -->
    <style>
        body {
            background:#f8fafc;
            font-family:'Segoe UI', Roboto, sans-serif;
            margin:0;
            /* Чтобы контент не прятался под фиксированный header */
            padding-top:80px;
        }

        .container {
            max-width:1200px;
            margin:0 auto;
            padding:0 20px 40px;
        }

        h1 {
            margin-bottom:20px;
            font-size:28px;
            color:#111827;
        }

        .top-bar {
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:16px;
        }

        .flash {
            margin-bottom:12px;
            padding:10px 12px;
            border-radius:10px;
            border:1px solid #d1d5db;
            background:#fff;
            box-shadow:0 2px 6px rgba(0,0,0,.04);
        }

        .muted {
            color:#6b7280;
            font-size:14px;
        }

        .table-wrap {
            border:1px solid #e5e7eb;
            border-radius:12px;
            overflow:hidden;
            background:#fff;
            box-shadow:0 2px 6px rgba(0,0,0,.05);
        }

        .table-scroll {
            overflow-x:auto;
        }

        table {
            width:100%;
            border-collapse:collapse;
            background:#fff;
        }

        th, td {
            padding:12px 16px;
            text-align:left;
            border-bottom:1px solid #e5e7eb;
        }

        th {
            background:#f3f4f6;
            font-weight:600;
            color:#374151;
        }

        tr:hover td {
            background:#f9fafb;
        }

        .actions {
            display:flex;
            gap:6px;
            flex-wrap:wrap;
        }

        .btn {
            display:inline-block;
            padding:6px 12px;
            border-radius:8px;
            border:1px solid transparent;
            cursor:pointer;
            text-decoration:none;
            font-size:14px;
            transition:.2s;
        }

        .btn.primary {
            background:#111827;
            color:#fff;
        }
        .btn.primary:hover {
            background:#1f2937;
        }

        .btn.ghost {
            background:#fff;
            color:#111827;
            border:1px solid #d1d5db;
        }
        .btn.ghost:hover {
            background:#f3f4f6;
        }

        .btn.danger {
            background:#fff;
            color:#b91c1c;
            border:1px solid #fecaca;
        }
        .btn.danger:hover {
            background:#fee2e2;
        }

        /* Адаптивность */
        @media (max-width: 1100px){
            .container{ padding:0 12px 40px; }
        }
        @media (max-width: 720px){
            .top-bar{ flex-direction:column; align-items:flex-start; gap:10px; }
            th, td{ padding:10px 12px; }
            .btn, .btn.ghost, .btn.primary, .btn.danger{ white-space:nowrap; }
        }
        @media (max-width: 480px){
            .actions{ width:100%; }
            .actions .btn{ flex:1 1 auto; text-align:center; }
        }
    </style>

    <!-- ТЁМНАЯ ТЕМА -->
    <style>
        body.dark {
            background:#000;
            color:#e5e7eb;
        }

        body.dark .flash {
            background:#0f172a;
            border-color:rgba(148,163,184,.22);
            color:#e5e7eb;
            box-shadow:0 8px 24px rgba(0,0,0,.45);
        }

        body.dark .table-wrap {
            background:#0f172a;
            border-color:rgba(148,163,184,.22);
            box-shadow:0 8px 24px rgba(0,0,0,.45);
        }

        body.dark table {
            background:#0f172a;
            color:#e5e7eb;
        }

        body.dark th {
            background:#111827;
            color:#e5e7eb;
        }

        body.dark th, body.dark td {
            border-bottom:1px solid rgba(148,163,184,.22);
        }

        body.dark tr:hover td {
            background:#0d1426;
        }

        body.dark .btn.primary {
            background:#111827;
            border-color:#111827;
            color:#fff;
        }

        body.dark .btn.ghost {
            background:transparent;
            color:#e5e7eb;
            border-color:rgba(148,163,184,.28);
        }

        body.dark .btn.danger {
            background:transparent;
            color:#fecaca;
            border-color:#7f1d1d;
        }

        body.dark .muted {
            color:#a3a3a3;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="top-bar">
        <h1>Адреса доставки</h1>
        <a class="btn primary" th:href="@{/manager/addresses/new}">➕ Добавить адрес</a>
    </div>

    <div th:if="${ok}" class="flash" th:text="${ok}"></div>

    <div class="table-wrap">
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Адрес (address_line)</th>
                    <th>Стоимость доставки</th>
                    <th>Заказ (order_id)</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="a : ${items}">
                    <td th:text="${a.id}">1</td>
                    <td th:text="${a.addressLine}">г. ...</td>
                    <td th:text="${a.shippingCost != null ? #numbers.formatDecimal(a.shippingCost,1,'COMMA',2,'POINT') + ' ₽' : '0,00 ₽'}">0,00 ₽</td>
                    <td th:text="${a.orderId != null ? a.orderId : '—'}">—</td>
                    <td>
                        <div class="actions">
                            <a class="btn ghost" th:href="@{|/manager/addresses/${a.id}/edit|}">✏ Изменить</a>
                            <form th:action="@{|/manager/addresses/${a.id}/delete|}" method="post" style="margin:0;display:inline" onsubmit="return confirm('Удалить адрес?')">
                                <input th:if="${_csrf != null}" type="hidden"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn danger">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(items)}" class="muted" style="margin-top:20px">
        Пока нет адресов.
    </div>

    <div style="margin-top:20px">
        <a class="btn ghost" th:href="@{/manager}">← Назад в панель менеджера</a>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
