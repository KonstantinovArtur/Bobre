<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Адреса доставки</title>

    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <style>
        body { background:#f8fafc; font-family:'Segoe UI', Roboto, sans-serif; padding:20px; }
        .container { max-width:1200px; margin:0 auto; }
        h1 { margin-bottom:20px; font-size:28px; color:#111827; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }

        .flash { margin-bottom:12px; padding:10px 12px; border-radius:10px; border:1px solid #d1d5db; background:#fff; }
        .muted { color:#6b7280; font-size:14px; }

        table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
        th, td { padding:12px 16px; text-align:left; border-bottom:1px solid #e5e7eb; }
        th { background:#f3f4f6; font-weight:600; color:#374151; }
        tr:hover td { background:#f9fafb; }

        .actions { display:flex; gap:6px; }
        .btn { display:inline-block; padding:6px 12px; border-radius:8px; border:1px solid transparent; cursor:pointer; text-decoration:none; font-size:14px; transition:.2s; }
        .btn.primary { background:#111827; color:#fff; }
        .btn.primary:hover { background:#1f2937; }
        .btn.ghost { background:#fff; color:#111827; border:1px solid #d1d5db; }
        .btn.ghost:hover { background:#f3f4f6; }
        .btn.danger { background:#fff; color:#b91c1c; border:1px solid #fecaca; }
        .btn.danger:hover { background:#fee2e2; }
    </style>
</head>

<body>
<div class="container">
    <div class="top-bar">
        <h1>Адреса доставки</h1>
        <a class="btn primary" th:href="@{/manager/addresses/new}">➕ Добавить адрес</a>
    </div>

    <!-- флеш -->
    <div th:if="${ok}" class="flash" th:text="${ok}"></div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Адрес (address_line)</th>
            <th>Стоимость доставки</th>
            <th>Заказ (order_id)</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${items}">
            <td th:text="${a.id}">1</td>
            <td th:text="${a.addressLine}">г. ...</td>
            <td th:text="${a.shippingCost != null ? #numbers.formatDecimal(a.shippingCost,1,'COMMA',2,'POINT') + ' ₽' : '0,00 ₽'}">0,00 ₽</td>

            <!-- order_id в твоей таблице есть; просто показываем как справочную инфу -->
            <td th:text="${a.orderId != null ? a.orderId : '—'}">—</td>

            <td>
                <div class="actions">
                    <a class="btn ghost" th:href="@{|/manager/addresses/${a.id}/edit|}">✏ Изменить</a>

                    <form th:action="@{|/manager/addresses/${a.id}/delete|}" method="post" style="margin:0;display:inline">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn danger"
                                onclick="return confirm('Удалить адрес?')">Удалить</button>
                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(items)}" class="muted" style="margin-top:20px">
        Пока нет адресов.
    </div>

    <div style="margin-top:20px">
        <a class="btn ghost" th:href="@{/manager}">← Назад в панель менеджера</a>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
