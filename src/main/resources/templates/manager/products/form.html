<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${isEdit} ? ('Редактирование товара #' + ${form.id}) : 'Новый товар'">Товар</title>

    <!-- Хедер -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- Базовый фон страницы (светлая/тёмная) -->
    <style>
        body{ background:#f8fafc; margin:0; }
        body.dark{ background:#000; }
    </style>

    <!-- Локальные стили страницы (namespaced) -->
    <style>
        .product-edit-page{ max-width:1000px; margin:20px auto; padding:0 16px; color:#111827; font-family:'Segoe UI', Roboto, sans-serif; }
        .product-edit-page h1{ margin:0 0 14px; }

        /* сетка */
        .product-edit-page .grid{ display:grid; grid-template-columns:1.2fr .8fr; gap:16px; align-items:start; }
        @media (max-width: 960px){ .product-edit-page .grid{ grid-template-columns:1fr; } }

        /* карточки/контент */
        .product-edit-page .card{
            border:1px solid #e5e7eb; border-radius:12px; background:#fff; padding:16px;
            box-shadow:0 2px 6px rgba(0,0,0,.05);
        }
        .product-edit-page label{ display:block; margin:8px 0 4px; }
        .product-edit-page input,
        .product-edit-page select,
        .product-edit-page textarea{
            width:100%; padding:8px; border:1px solid #e5e7eb; border-radius:8px; background:#fff; font:inherit;
        }
        .product-edit-page .row{ display:flex; gap:12px; flex-wrap:wrap; }
        .product-edit-page .col{ flex:1; min-width:220px; }

        /* кнопки */
        .product-edit-page .btn{
            padding:10px 14px; border-radius:8px; border:1px solid #111827; background:#111827; color:#fff; cursor:pointer;
            transition:.2s; display:inline-flex; align-items:center; justify-content:center; gap:8px;
        }
        .product-edit-page .btn:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.15); }
        .product-edit-page .btn.ghost{ background:#fff; color:#111827; border-color:#e5e7eb; }
        .product-edit-page .muted{ color:#6b7280; }
        .product-edit-page .thumb{
            width:100%; aspect-ratio:4/3; object-fit:contain; border:1px dashed #e5e7eb; border-radius:10px; background:#fafafa;
        }

        .product-edit-page .chip{
            display:inline-block; border:1px solid #e5e7eb; border-radius:999px; padding:2px 8px; font-size:12px;
            background:#f9fafb; color:#374151;
        }

        .product-edit-page .imgs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px; }
        .product-edit-page .imgcard{
            border:1px solid #e5e7eb; border-radius:10px; padding:8px; background:#fff; display:flex; flex-direction:column; gap:8px;
            box-shadow:0 1px 4px rgba(0,0,0,.04);
        }
        .product-edit-page .imgcard img{
            width:100%; height:100px; object-fit:contain; background:#f8fafc; border-radius:6px;
        }
        .product-edit-page .actions{ display:flex; gap:6px; flex-wrap:wrap; }

        /* ошибки */
        .product-edit-page .alert{
            background:#fef2f2; border:1px solid #fecaca; color:#991b1b; border-radius:8px; padding:10px; margin-bottom:12px;
        }
        .product-edit-page .error{ color:#b91c1c; margin-top:6px; font-size:.9rem; }
        .product-edit-page .field-error{ border-color:#fca5a5; background:#fef2f2; }

        /* адаптив по мелочи */
        @media (max-width: 560px){
            .product-edit-page .btn,
            .product-edit-page .btn.ghost{ width:100%; }
            .product-edit-page .col{ min-width:100%; }
        }

        /* ===== ТЁМНАЯ ТЕМА (карточки/формы/кнопки/изображения) ===== */
        body.dark .product-edit-page{ color:#e5e7eb; }
        body.dark .product-edit-page .card{
            background:#0f172a !important; border-color:rgba(148,163,184,.22) !important;
            color:#e5e7eb; box-shadow:0 8px 24px rgba(0,0,0,.45);
        }
        body.dark .product-edit-page input,
        body.dark .product-edit-page select,
        body.dark .product-edit-page textarea{
            background:#0b1220; color:#e5e7eb; border-color:rgba(148,163,184,.28);
        }
        body.dark .product-edit-page input:focus,
        body.dark .product-edit-page select:focus,
        body.dark .product-edit-page textarea:focus{
            outline:0; border-color:#8b5cf6; box-shadow:0 0 0 3px rgba(139,92,246,.25);
        }
        body.dark .product-edit-page .btn{ background:#111827; border-color:#111827; color:#fff; }
        body.dark .product-edit-page .btn.ghost{ background:transparent; color:#e5e7eb; border-color:rgba(148,163,184,.28); }
        body.dark .product-edit-page .muted{ color:#a3a3a3; }
        body.dark .product-edit-page .thumb{ background:#0b1220; border-color:rgba(148,163,184,.28); }
        body.dark .product-edit-page .chip{ background:#0b1220; border-color:rgba(148,163,184,.28); color:#cbd5e1; }
        body.dark .product-edit-page .imgcard{
            background:#0f172a; border-color:rgba(148,163,184,.22);
            box-shadow:0 6px 16px rgba(0,0,0,.35);
        }
        body.dark .product-edit-page .imgcard img{ background:#0b1220; }
        body.dark .product-edit-page .alert{ background:#3b0a0a; border-color:#7f1d1d; color:#fee2e2; }
        body.dark .product-edit-page .field-error{ background:#2a0f0f; border-color:#ef4444; }
    </style>

    <!-- Мгновенное применение сохранённой темы (чтобы не мигало) -->
    <script>
        (function(){
            try{
                if(localStorage.getItem('theme')==='dark'){ document.body.classList.add('dark'); }
            }catch(e){}
        })();
    </script>
</head>
<body>

<div class="product-edit-page">
    <h1 th:text="${isEdit} ? ('Редактирование товара #' + ${form.id}) : 'Новый товар'">Товар</h1>

    <div class="grid">
        <!-- Левая колонка: форма полей -->
        <div class="card">
            <form th:action="${isEdit} ? @{|/manager/products/${form.id}/update|} : @{/manager/products/create}"
                  th:object="${form}"
                  method="post">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div th:if="${#fields.hasAnyErrors()}" class="alert">Пожалуйста, исправьте ошибки ниже.</div>

                <label for="name">Название</label>
                <input id="name" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? ' field-error'"/>
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Ошибка имени</div>

                <label for="description">Описание</label>
                <textarea id="description" rows="5" th:field="*{description}"
                          th:classappend="${#fields.hasErrors('description')} ? ' field-error'"></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Ошибка описания</div>

                <div class="row">
                    <div class="col">
                        <label for="price">Цена</label>
                        <input id="price" type="number" step="0.01" min="0" th:field="*{price}"
                               th:classappend="${#fields.hasErrors('price')} ? ' field-error'"/>
                        <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>
                    <div class="col">
                        <label for="stockQty">Склад (шт)</label>
                        <input id="stockQty" type="number" min="0" th:field="*{stockQty}"
                               th:classappend="${#fields.hasErrors('stockQty')} ? ' field-error'"/>
                        <div class="error" th:if="${#fields.hasErrors('stockQty')}" th:errors="*{stockQty}"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col">
                        <label for="discountPercent">Скидка (%)</label>
                        <input id="discountPercent" type="number" step="0.01" min="0" max="100" th:field="*{discountPercent}"
                               th:classappend="${#fields.hasErrors('discountPercent')} ? ' field-error'"/>
                        <div class="error" th:if="${#fields.hasErrors('discountPercent')}" th:errors="*{discountPercent}"></div>
                    </div>
                    <div class="col">
                        <label for="categoryId">Категория</label>
                        <select id="categoryId" th:field="*{categoryId}">
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Категория</option>
                        </select>
                        <div class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
                    </div>
                </div>

                <label class="row" style="align-items:center;gap:8px;margin-top:8px">
                    <input type="checkbox" th:field="*{promotional}"/>
                    <span>Промо-товар</span>
                </label>

                <div class="row" style="margin-top:16px">
                    <button class="btn" type="submit">Сохранить</button>
                    <a class="btn ghost" th:href="@{/manager/products}">Отмена</a>
                </div>
            </form>
        </div>

        <!-- Правая колонка: изображения -->
        <div class="card">
            <div class="row" style="justify-content:space-between;align-items:center;">
                <h3 style="margin:0">Изображения</h3>
                <span class="chip" th:if="${isEdit}" th:text="${#lists.size(images)} + ' шт'">0 шт</span>
            </div>

            <!-- Превью текущей "главной" -->
            <div th:if="${isEdit}" style="margin:10px 0">
                <img class="thumb"
                     th:if="${primaryImageId != null}"
                     th:src="@{|/manager/products/images/${primaryImageId}/preview|}"
                     alt="primary"/>
                <div class="muted" th:if="${primaryImageId == null}" style="margin-top:6px">
                    Картинок пока нет — загрузите первое изображение.
                </div>
                <div class="muted" th:if="${primaryImageId != null}" style="margin-top:6px">
                    Текущая «главная» (то, что видит клиент в каталоге).
                </div>
            </div>

            <!-- Загрузка новой картинки (только при редактировании) -->
            <form th:if="${isEdit}"
                  th:action="@{|/manager/products/${form.id}/images/add|}"
                  method="post" enctype="multipart/form-data" style="margin-top:12px">
                <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label>Добавить картинку</label>
                <input type="file" name="upload" accept="image/*" required/>

                <label class="row" style="align-items:center;gap:8px;margin-top:6px">
                    <input type="checkbox" name="makePrimary"/>
                    <span>Сделать главной</span>
                </label>

                <div class="row" style="margin-top:10px">
                    <button class="btn" type="submit">Загрузить</button>
                </div>
            </form>

            <!-- Список изображений -->
            <div th:if="${isEdit}" class="imgs" style="margin-top:14px">
                <div class="imgcard" th:each="img : ${images}">
                    <img th:src="@{|/manager/products/images/${img.id}/preview|}" alt="img"/>
                    <div class="muted" th:text="${img.filename}">filename.png</div>
                    <div class="actions">
                        <form th:if="${!img.primary}"
                              th:action="@{|/manager/products/${form.id}/images/${img.id}/primary|}" method="post">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn" type="submit">Сделать главной</button>
                        </form>

                        <span th:if="${img.primary}" class="chip">Главная</span>

                        <form th:action="@{|/manager/products/${form.id}/images/${img.id}/delete|}"
                              method="post"
                              onsubmit="return confirm('Удалить изображение?');">
                            <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button class="btn ghost" type="submit">Удалить</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- При создании: заглушка -->
            <div th:if="${!isEdit}" class="muted" style="margin-top:8px">
                Сначала сохраните товар, затем сможете добавить картинки.
            </div>
        </div>
    </div>
</div>

<!-- Футер -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>

</body>
</html>
