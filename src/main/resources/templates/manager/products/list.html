<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Управление товарами</title>

    <!-- Общий хедер -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- Фон страницы под тему -->
    <style>
        body{ background:#f8fafc; margin:0; font-family:'Segoe UI', Roboto, sans-serif; }
        body.dark{ background:#000; }
    </style>

    <!-- Локальные стили (namespaced) -->
    <style>
        .products-page{ max-width:1200px; margin:0 auto; padding:24px 16px; color:#111827; }
        .products-page h1{ margin:0 0 20px; font-size:28px; }

        .products-page .top-bar{ display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }

        /* карточка-обёртка для таблицы и флешей */
        .products-page .card{
            background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px;
            box-shadow:0 2px 6px rgba(0,0,0,.05); margin-bottom:16px;
        }

        /* флеши */
        .products-page .flash{ border-radius:10px; padding:10px 12px; }
        .products-page .flash.ok{ border:1px solid #86efac; background:#dcfce7; color:#166534; }
        .products-page .flash.err{ border:1px solid #fecaca; background:#fee2e2; color:#991b1b; }

        /* кнопки */
        .products-page .btn{
            display:inline-block; padding:10px 14px; border-radius:10px; border:1px solid transparent;
            cursor:pointer; text-decoration:none; font-size:14px; transition:.2s;
        }
        .products-page .btn.primary{ background:#111827; color:#fff; border-color:#111827; }
        .products-page .btn.primary:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(0,0,0,.15); }
        .products-page .btn.ghost{ background:#fff; color:#111827; border:1px solid #d1d5db; }
        .products-page .btn.ghost:hover{ background:#f3f4f6; }
        .products-page .btn.danger{ background:#fff; color:#b91c1c; border:1px solid #fecaca; }
        .products-page .btn.danger:hover{ background:#fee2e2; }
        .products-page .actions{ display:flex; gap:8px; flex-wrap:wrap; }

        /* таблица внутри карточки-обёртки */
        .products-page .table-wrap{ border-radius:12px; overflow:hidden; border:1px solid #e5e7eb; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.05); }
        .products-page .table-scroll{ overflow-x:auto; }
        .products-page table{ width:100%; border-collapse:collapse; background:#fff; }
        .products-page th, .products-page td{ padding:12px 16px; text-align:left; border-bottom:1px solid #e5e7eb; }
        .products-page thead th{ background:#f3f4f6; font-weight:600; color:#374151; white-space:nowrap; }
        .products-page tbody tr:hover td{ background:#f9fafb; }

        .products-page .muted{ color:#6b7280; font-size:14px; }

        /* адаптивность */
        @media (max-width: 900px){
            .products-page .top-bar{ gap:10px; }
            .products-page thead th:nth-child(3),
            .products-page tbody td:nth-child(3){ white-space:nowrap; }
        }
        @media (max-width: 640px){
            .products-page h1{ font-size:22px; }
            .products-page .btn{ padding:8px 12px; }
            .products-page th, .products-page td{ padding:10px 12px; }
        }

        /* ===== ТЁМНАЯ ТЕМА ===== */
        body.dark .products-page{ color:#e5e7eb; }
        body.dark .products-page .card{
            background:#0f172a !important; border-color:rgba(148,163,184,.22) !important;
            color:#e5e7eb; box-shadow:0 8px 24px rgba(0,0,0,.45);
        }
        body.dark .products-page .flash.ok{ background:#052e1f; border-color:#166534; color:#d1fae5; }
        body.dark .products-page .flash.err{ background:#3b0a0a; border-color:#7f1d1d; color:#fee2e2; }

        body.dark .products-page .table-wrap{ background:#0f172a; border-color:rgba(148,163,184,.22); }
        body.dark .products-page table{ background:#0f172a; color:#e5e7eb; }
        body.dark .products-page thead th{ background:#111827; color:#e5e7eb; }
        body.dark .products-page th, body.dark .products-page td{ border-bottom:1px solid rgba(148,163,184,.22); }
        body.dark .products-page tbody tr:hover td{ background:#0d1426; }

        body.dark .products-page .btn.primary{ background:#111827; border-color:#111827; color:#fff; }
        body.dark .products-page .btn.ghost{ background:transparent; color:#e5e7eb; border-color:rgba(148,163,184,.28); }
        body.dark .products-page .btn.danger{ background:transparent; color:#fecaca; border-color:#7f1d1d; }
    </style>
</head>

<body>
<div class="products-page">
    <div class="top-bar">
        <h1>Товары</h1>
        <a class="btn primary" th:href="@{/manager/products/new}">➕ Добавить товар</a>
    </div>

    <!-- флеши -->
    <div th:if="${ok}" class="flash ok" th:text="${ok}"></div>
    <div th:if="${error}" class="flash err" th:text="${error}"></div>

    <!-- карточка-обёртка с таблицей -->
    <div class="table-wrap">
        <div class="table-scroll">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Категория (ID)</th>
                    <th>Цена</th>
                    <th>Скидка</th>
                    <th>Акция</th>
                    <th>Остаток</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.id}">1</td>
                    <td th:text="${p.name}">Название</td>

                    <!-- ВАЖНО: тернарный оператор в одном выражении -->
                    <td th:text="${p.category != null} ? ${p.category.id} : '-'">-</td>
                    <!-- Правильно: -->
                    <!-- <td th:text="${p.category != null ? p.category.id : '-'}">-</td> -->

                    <td th:text="${p.price != null ? #numbers.formatDecimal(p.price,1,'COMMA',2,'POINT') + ' ₽' : '—'}">0,00 ₽</td>
                    <td th:text="${p.discountPercent != null ? (p.discountPercent + '%') : '—'}">0%</td>
                    <td th:text="${p.promotional} ? 'Да' : 'Нет'">Нет</td>
                    <td th:text="${p.stockQty}">0</td>
                    <td>
                        <div class="actions">
                            <a class="btn ghost" th:href="@{|/manager/products/${p.id}/edit|}">✏ Изменить</a>

                            <form th:action="@{|/manager/products/${p.id}/delete|}" method="post" style="margin:0;display:inline">
                                <input th:if="${_csrf != null}" type="hidden"
                                       th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn danger" onclick="return confirm('Удалить товар?')">Удалить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="muted" style="margin-top:8px">
        Пока нет товаров в каталоге.
    </div>

    <div style="margin-top:16px">
        <a class="btn ghost" th:href="@{/manager}">← Назад в панель менеджера</a>
    </div>
</div>

<!-- Общий футер -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
