<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление товарами</title>

    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <style>
        body {
            background: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            color: #111827;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background: #f3f4f6;
            font-weight: 600;
            color: #374151;
        }
        tr:hover td {
            background: #f9fafb;
        }
        .actions {
            display: flex;
            gap: 6px;
        }
        .btn {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn.primary {
            background: #111827;
            color: #fff;
        }
        .btn.primary:hover {
            background: #1f2937;
        }
        .btn.ghost {
            background: #fff;
            color: #111827;
            border: 1px solid #d1d5db;
        }
        .btn.ghost:hover {
            background: #f3f4f6;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .muted {
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="top-bar">
        <h1>Товары</h1>
        <a class="btn primary" th:href="@{/manager/products/new}">➕ Добавить товар</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Название</th>
            <th>Категория</th>
            <th>Цена</th>
            <th>Скидка</th>
            <th>Акция</th>
            <th>Остаток</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.name}">Название</td>
            <td th:text="${p.categoryName} ?: '-'">Категория</td>
            <td th:text="${#numbers.formatDecimal(p.price,1,'COMMA',2,'POINT')} + ' ₽'">0.00 ₽</td>
            <td th:text="${p.discountPercent != null ? p.discountPercent + '%' : '—'}">0%</td>
            <td th:text="${p.promotional ? 'Да' : 'Нет'}"></td>
            <td th:text="${p.stockQty}">0</td>
            <td>
                <div class="actions">
                    <a class="btn ghost" th:href="@{'/manager/products/edit/' + ${p.id}}">✏ Изменить</a>
                    <form th:action="@{'/manager/products/delete/' + ${p.id}}" method="post" style="margin:0">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <form th:action="@{|/manager/products/${p.id}/delete|}"
                              method="post" style="display:inline">
                            <input th:if="${_csrf != null}" type="hidden"
                                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn danger"
                                    onclick="return confirm('Удалить товар?')">Удалить</button>
                        </form>

                    </form>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(products)}" class="muted" style="margin-top:20px">
        Пока нет товаров в каталоге.
    </div>

    <div style="margin-top:20px">
        <a class="btn ghost" th:href="@{/manager}">← Назад в панель менеджера</a>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
