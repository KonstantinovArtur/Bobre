<!-- src/main/resources/templates/manager/orders/list.html -->
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заказы — панель менеджера</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <style>
        body { background:#f8fafc; font-family:'Segoe UI', Roboto, sans-serif; padding:20px; }
        .container { max-width:1200px; margin:0 auto; }
        h1 { margin-bottom:20px; font-size:28px; color:#111827; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .flash { margin-bottom:12px; padding:10px 12px; border-radius:10px; border:1px solid #d1d5db; background:#fff; }
        .muted { color:#6b7280; font-size:13px; }

        table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.05); }
        th, td { padding:12px 16px; text-align:left; border-bottom:1px solid #e5e7eb; vertical-align:middle; }
        th { background:#f3f4f6; font-weight:600; color:#374151; }
        tr:hover td { background:#f9fafb; }

        .actions { display:flex; gap:6px; }
        .btn { display:inline-block; padding:6px 12px; border-radius:8px; border:1px solid transparent; cursor:pointer; text-decoration:none; font-size:14px; transition:.2s; }
        .btn.primary { background:#111827; color:#fff; }
        .btn.primary:hover { background:#1f2937; }
        .btn.ghost { background:#fff; color:#111827; border:1px solid #d1d5db; }
        .btn.ghost:hover { background:#f3f4f6; }
        .btn.disabled { background:#e5e7eb; color:#9ca3af; cursor:not-allowed; border:1px solid #e5e7eb; }

        .chip { display:inline-block; border:1px solid #e5e7eb; border-radius:999px; padding:2px 8px; font-size:12px; background:#f9fafb; color:#374151 }
        .chip.green { background:#ecfdf5; border-color:#a7f3d0; color:#065f46; }
        .chip.yellow { background:#fffbeb; border-color:#fde68a; color:#92400e; }
        .chip.gray { background:#f3f4f6; border-color:#d1d5db; color:#374151; }
    </style>
</head>

<body>
<div class="container">
    <div class="top-bar">
        <h1>Заказы</h1>
        <a class="btn ghost" th:href="@{/manager}">← В панель</a>
    </div>

    <!-- флеш -->
    <div th:if="${ok}" class="flash" th:text="${ok}"></div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Внешний №</th>
            <th>Дата</th>
            <th>Пользователь</th>
            <th>Сумма</th>
            <th>Статус</th>
            <th style="width:220px">Данные</th>
            <th style="width:220px">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${orders}">
            <td th:text="${row.orderId}">1</td>

            <!-- внешний номер приходит из репозитория/SQL как idOrder -->
            <td th:text="${row.idOrder}">ORD-000001</td>

            <td th:text="${#temporals.format(row.orderDate, 'dd.MM.yyyy HH:mm')}">01.11.2025 10:15</td>

            <td>
                <div th:text="${row.userLogin}">user</div>
                <div class="muted" th:text="${'#' + row.userId}">#5</div>
            </td>

            <td th:text="${row.total != null ? #numbers.formatDecimal(row.total, 1, 'COMMA', 2, 'POINT') + ' ₽' : '—'}">0,00 ₽</td>

            <td>
                <span th:class="${'chip ' + (row.statusCode=='created' ? 'yellow' : (row.statusCode=='in_transit' ? 'green' : 'gray'))}"
                      th:text="${row.statusTitle}">Оформлен</span>
            </td>

            <td>
                <div class="muted"
                     th:text="${row.addressLine != null && !#strings.isEmpty(row.addressLine) ? 'Адрес: ' + row.addressLine : 'Адрес: —'}">
                    Адрес: —
                </div>
                <div class="muted"
                     th:text="${'Доставка: ' + (row.shippingCost != null ? #numbers.formatDecimal(row.shippingCost,1,'COMMA',2,'POINT') + ' ₽' : '—')}">
                    Доставка: —
                </div>
                <div class="muted" th:if="${row.itemsCount != null}"
                     th:text="${'Позиций: ' + row.itemsCount}">Позиций: 0</div>
            </td>

            <td>
                <div class="actions">
                    <!-- created -> in_transit -->
                    <form th:if="${row.statusTitle == 'Оформлен'}"
                          th:action="@{|/manager/orders/${row.orderId}/confirm|}"
                          method="post" style="margin:0">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn primary">В пункте выдачи</button>
                    </form>

                    <!-- in_transit -> received -->
                    <form th:if="${row.statusTitle == 'Ожидает получения'}"
                          th:action="@{|/manager/orders/${row.orderId}/receive|}"
                          method="post" style="margin:0">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn primary">Получен</button>
                    </form>

                    <!-- Прочие статусы -->
                    <button th:if="${row.statusCode != 'created' and row.statusCode != 'in_transit'}"
                            class="btn disabled" disabled>Недоступно</button>

                    <a class="btn ghost" th:href="@{|/orders/${row.orderId}|}">Детали</a>
                </div>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(orders)}" class="muted" style="margin-top:20px">
        Пока заказов нет.
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
