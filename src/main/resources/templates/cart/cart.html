<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Корзина</title>

    <!-- Хедер-фрагмент -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <!-- БАЗОВЫЕ стили страницы (НЕ трогаем общий .container из хедера!) -->
    <style>
        /* свой контейнер только для этой страницы */
        .cart-container{max-width:900px;margin:20px auto;padding:0 16px;}
        h1{margin:0 0 12px}

        .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:16px;margin:10px 0}
        .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap}
        .muted{color:#6b7280}
        .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer;transition:.15s}
        .btn:hover{transform:translateY(-1px)}
        .btn.ghost{background:#fff;color:#111827}
        .total{font-weight:800;font-size:20px}
        select,input[type="text"],input[type="number"]{padding:8px;border:1px solid #e5e7eb;border-radius:8px}
        .col{display:flex;flex-direction:column;gap:8px}
    </style>

    <!-- ТЁМНАЯ ТЕМА + адаптив (привязано к классам страницы) -->
    <style>
        body.dark{ background:#000; color:#e5e7eb; }

        body.dark .card{
            background:#0f172a !important;
            border-color:rgba(148,163,184,.22) !important;
            box-shadow:0 8px 24px rgba(0,0,0,.45);
            color:#e5e7eb;
        }
        body.dark .muted{ color:#a3a3a3 !important; }

        body.dark select,
        body.dark input[type="text"],
        body.dark input[type="number"]{
            background:#0b1220;
            color:#e5e7eb;
            border-color:rgba(148,163,184,.28);
        }
        body.dark select:focus,
        body.dark input[type="text"]:focus,
        body.dark input[type="number"]:focus{
            outline:0;
            border-color:#8b5cf6;
            box-shadow:0 0 0 3px rgba(139,92,246,.25);
        }

        body.dark .btn{ background:#111827; border-color:#111827; color:#fff; }
        body.dark .btn:hover{ box-shadow:0 8px 20px rgba(0,0,0,.35); transform:translateY(-1px); }
        body.dark .btn.ghost{ background:transparent; color:#e5e7eb; border-color:rgba(148,163,184,.28); }

        @media (max-width: 768px){
            .row{ flex-wrap:wrap; align-items:flex-start; }
            .row > *{ margin-top:6px; }
            .total{ font-size:18px; }
            form.card{ width:100%; }
            .btn, .btn.ghost{ white-space:nowrap; }
        }
        @media (max-width: 520px){
            .btn, .btn.ghost{ width:100%; justify-content:center; }
            .row{ gap:10px; }
        }
    </style>

    <script>
        (function(){
            try{
                var t = localStorage.getItem('theme');
                if(t === 'dark'){ document.body.classList.add('dark'); }
            }catch(e){}
        })();
    </script>
</head>
<body>
<!-- используем отдельный контейнер, чтобы не цеплять хедер -->
<div class="cart-container">

    <h1>Корзина</h1>

    <!-- флеши -->
    <div th:if="${ok}" class="card" th:text="${ok}"></div>
    <div th:if="${error}" class="card" style="border-color:#ef4444;color:#b91c1c" th:text="${error}"></div>

    <!-- ПУСТО -->
    <div th:if="${cart.empty}" class="muted">Корзина пуста.</div>

    <!-- ЕСТЬ ТОВАРЫ -->
    <div th:if="${!cart.empty}">
        <div class="card" th:each="i : ${cart.items}">
            <div class="row">
                <div>
                    <div><b th:text="${i.name}">Название</b></div>
                    <div class="muted">
                        ID: <span th:text="${i.productId}">0</span> ·
                        Цена: <span th:text="${#numbers.formatDecimal(i.priceFinal,1,'COMMA',2,'POINT')}">0,00</span> ₽ ·
                        Кол-во: <b th:text="${i.qty}">1</b>
                    </div>
                </div>

                <div class="row" style="gap:8px">
                    <div><b th:text="${#numbers.formatDecimal(i.lineTotal,1,'COMMA',2,'POINT')}">0,00</b> ₽</div>
                    <form th:action="@{/cart/remove}" method="post" style="margin:0">
                        <input type="hidden" name="productId" th:value="${i.productId}"/>
                        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button class="btn ghost" type="submit">✖ Удалить</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="row" style="margin-top:12px">
            <a class="btn ghost" th:href="@{/products}">← В каталог</a>

            <div class="row" style="gap:8px; align-items:flex-start">
                <div class="total">
                    Итого: <span th:text="${#numbers.formatDecimal(cart.total,1,'COMMA',2,'POINT')}">0,00</span> ₽
                </div>

                <form th:action="@{/cart/clear}" method="post" style="margin:0">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="btn ghost" type="submit">Очистить</button>
                </form>

                <!-- Оформление: адрес + submit -->
                <form th:action="@{/cart/checkout}" method="post" class="card" style="margin:0">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="col" style="min-width:320px">
                        <label class="muted">Адрес доставки</label>

                        <div th:if="${addresses != null and !#lists.isEmpty(addresses)}">
                            <select name="address" required style="width:100%">
                                <option value="" disabled selected>Выберите адрес</option>
                                <option th:each="a : ${addresses}" th:value="${a}" th:text="${a}"></option>
                            </select>
                        </div>

                        <div th:if="${addresses == null or #lists.isEmpty(addresses)}">
                            <input type="text" name="address" required placeholder="Введите адрес доставки" style="width:100%"/>
                        </div>

                        <button class="btn" type="submit">Оформить заказ</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
