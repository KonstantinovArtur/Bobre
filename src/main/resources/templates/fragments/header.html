<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security"
      th:fragment="header">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${title} ?: 'Кузница'">Кузница</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <style>
        :root {
            --bg: #222;
            --fg: #fff;
            --hover: #333;
            --menu-bg: #fff;
            --menu-fg: #111;
        }
        body {margin:0; background:#f9f9f9; font-family: system-ui, Arial, sans-serif;}
        header {background:var(--bg); color:var(--fg); position:sticky; top:0; z-index:100;}
        .container {max-width:1100px; margin:0 auto; padding:10px 16px;}
        nav.nav {display:flex; align-items:center; flex-wrap:wrap; gap:12px;}
        nav.nav a {color:var(--fg); text-decoration:none; padding:6px 10px; border-radius:6px; font-weight:500;}
        nav.nav a:hover {background:var(--hover);}
        .brand {font-weight:700; display:flex; align-items:center; gap:6px;}
        .spacer {flex:1;}

        /* выпадающее меню */
        .dropdown {position:relative;}
        .dropdown > button {
            background:none; border:none; color:var(--fg);
            font:inherit; cursor:pointer; padding:6px 10px; border-radius:6px;
        }
        .dropdown > button:hover {background:var(--hover);}
        .menu {
            display:none;
            position:absolute;
            top:100%;
            left:0;
            background:#2a2a2a;           /* <-- стало тёмное меню */
            color:#fff;                   /* <-- белый текст */
            border-radius:8px;
            box-shadow:0 6px 18px rgba(0,0,0,0.3);
            min-width:200px;
            margin-top:6px;
            padding:8px 0;
            border:1px solid #3a3a3a;     /* лёгкая рамка */
        }

        .menu a {
            display:block;
            color:#fff;                   /* текст белый по умолчанию */
            padding:8px 14px;
            text-decoration:none;
            font-weight:500;
        }
        .menu a:hover {
            background:#444;              /* мягкий ховер */
        }
        .dropdown:hover .menu,
        .dropdown:focus-within .menu {
            display:block;
        }


        /* правый блок */
        .user {display:flex; align-items:center; gap:10px; color:var(--fg);}
        .btn-link {background:none; border:none; color:var(--fg); cursor:pointer; padding:0; text-decoration:underline;}
        .muted {color:#cbd5e1;}
        @media(max-width:800px){
            nav.nav {gap:8px;}
            .menu {min-width:160px;}
        }
    </style>
</head>

<body>
<header>
    <div class="container">
        <nav class="nav">
            <a class="brand" th:href="@{/}">🏠 Главная</a>
            <a th:href="@{/products}">Каталог</a>
            <a th:href="@{/cart}">Корзина</a>
            <a th:href="@{/orders}">Заказы</a>

            <!-- Менеджерское меню -->
            <div class="dropdown" sec:authorize="hasAnyRole('Admin','Manager')">
                <button>Управление ▾</button>
                <div class="menu">
                    <a th:href="@{/manager/products}">Товары</a>
                    <a th:href="@{/manager/categories}">Категории</a>
                    <a th:href="@{/manager/addresses}">Адреса</a>
                    <a th:href="@{/manager/orders}">Заказы</a>
                </div>
            </div>

            <!-- Админское меню -->
            <div class="dropdown" sec:authorize="hasRole('Admin') or hasAuthority('Admin')">
                <button>Админ ▾</button>
                <div class="menu">
                    <a th:href="@{/admin/users}">Пользователи</a>
                    <a th:href="@{/admin/roles}">Роли</a>
                    <a th:href="@{/admin/logs}">Логи</a>
                    <a th:href="@{/admin/analytics}">Отчеты</a>
                </div>
            </div>

            <div class="spacer"></div>

            <!-- Пользователь -->
            <div class="user">
                <span sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}">Войти</a> |
                    <a th:href="@{/register}">Регистрация</a>
                </span>

                <span sec:authorize="isAuthenticated()">
                    👤 <b sec:authentication="name">user</b>
                    <a th:href="@{/profile}">Профиль</a>
                    <form th:action="@{/logout}" method="post" style="display:inline">
                        <input th:if="${_csrf != null}" type="hidden"
                               th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn-link">Выйти</button>
                    </form>
                </span>
            </div>
        </nav>
    </div>
</header>

<main class="container">
