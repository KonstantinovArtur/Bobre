<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Админ · Пользователи</title>
  <th:block th:replace="~{fragments/header :: header}"></th:block>
  <style>
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid #e5e7eb;padding:8px}
    .row{display:flex;gap:8px;align-items:center}
    .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:12px;margin:12px 0}
    .btn{padding:6px 10px;border:1px solid #111827;border-radius:8px;background:#111827;color:#fff}
    .btn.ghost{background:#fff;color:#111827}
    input,select{padding:6px;border:1px solid #e5e7eb;border-radius:8px}
  </style>
</head>
<body>
<div class="container">
  <h1>Админ · Пользователи</h1>

  <div th:if="${ok}" class="card" th:text="${ok}"></div>

  <!-- Создать -->
  <div class="card">
    <form th:action="@{/admin/users/create}" method="post" class="row">
      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input name="login" placeholder="login" required>
      <input name="email" placeholder="email" required type="email">
      <input name="name" placeholder="name">
      <input name="password" placeholder="password" required type="password">
      <select name="roleId" required>
        <option th:each="r : ${roles}" th:value="${r.roleId}" th:text="${r.roleName}"></option>
      </select>
      <button class="btn" type="submit">Добавить</button>
    </form>
  </div>

  <!-- Таблица -->
  <table>
    <thead>
    <tr><th>ID</th><th>Логин</th><th>Имя</th><th>Email</th><th>Роль</th><th>Действия</th></tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.userId}">1</td>
      <td th:text="${u.login}">login</td>
      <td th:text="${u.name}">name</td>
      <td th:text="${u.email}">mail</td>
      <td>
        <form th:action="@{|/admin/users/${u.userId}/role|}" method="post" class="row">
          <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <select name="roleId">
            <option th:each="r : ${roles}"
                    th:value="${r.roleId}"
                    th:selected="${u.role != null and u.role.roleId == r.roleId}"
                    th:text="${r.roleName}"></option>
          </select>
          <button class="btn" type="submit">Сменить</button>
        </form>
      </td>
      <td>
        <form th:action="@{|/admin/users/${u.userId}/delete|}" method="post" onsubmit="return confirm('Удалить пользователя?')">
          <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn ghost" type="submit">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <p style="margin-top:12px"><a class="btn ghost" th:href="@{/}">← На главную</a></p>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
