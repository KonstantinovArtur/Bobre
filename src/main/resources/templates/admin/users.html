<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Админ · Пользователи</title>
  <th:block th:replace="~{fragments/header :: header}"></th:block>
  <style>
    table{width:100%;border-collapse:collapse;background:#fff}
    th,td{border:1px solid #e5e7eb;padding:8px}
    .row{display:flex;gap:8px;align-items:center}
    .card{border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:12px;margin:12px 0}
    .btn{padding:6px 10px;border:1px solid #111827;border-radius:8px;background:#111827;color:#fff}
    .btn.ghost{background:#fff;color:#111827}
    input,select{padding:6px;border:1px solid #e5e7eb;border-radius:8px}
    .alert-ok{background:#ecfdf5;border:1px solid #34d399;color:#065f46;border-radius:10px;padding:10px;margin:12px 0}
    .alert-err{background:#fef2f2;border:1px solid #fca5a5;color:#7f1d1d;border-radius:10px;padding:10px;margin:12px 0}
    .field-error{border-color:#ef4444}
    .error-text{font-size:.85rem;color:#b91c1c;margin-top:4px}
    .col{display:flex;flex-direction:column}
  </style>
</head>
<body>
<div class="container">
  <h1>Админ · Пользователи</h1>

  <!-- зеленый баннер об успехе -->
  <div th:if="${ok}" class="flash"
       style="background:#dcfce7;border:1px solid #86efac;color:#166534;margin-bottom:10px;padding:10px;border-radius:8px;"
       th:text="${ok}"></div>

  <div th:if="${error}" class="flash"
       style="background:#fee2e2;border:1px solid #fecaca;color:#991b1b;margin-bottom:10px;padding:10px;border-radius:8px;"
       th:text="${error}"></div>

  <!-- Создать -->
  <div class="card">
    <form th:action="@{/admin/users/create}" th:object="${createForm}" method="post" class="row" style="flex-wrap:wrap;gap:10px">
      <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <!-- сводка валидации (если надо показать список всех ошибок) -->
      <div class="alert-err" th:if="${#fields.hasErrors('*')}" style="width:100%">
        <div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div>
      </div>

      <!-- поля с подсветкой ошибок -->
      <div class="col">
        <input th:field="*{login}" placeholder="login" required
               th:classappend="${#fields.hasErrors('login')} ? ' field-error'">
        <div class="error-text" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></div>
      </div>

      <div class="col">
        <input th:field="*{email}" placeholder="email" type="email" required
               th:classappend="${#fields.hasErrors('email')} ? ' field-error'">
        <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
      </div>

      <div class="col">
        <input th:field="*{name}" placeholder="name"
               th:classappend="${#fields.hasErrors('name')} ? ' field-error'">
        <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
      </div>

      <div class="col">
        <input th:field="*{password}" placeholder="password" type="password" required
               th:classappend="${#fields.hasErrors('password')} ? ' field-error'">
        <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
      </div>

      <div class="col">
        <select th:field="*{roleId}" required
                th:classappend="${#fields.hasErrors('roleId')} ? ' field-error'">
          <option value="" hidden>Выберите роль…</option>
          <option th:each="r : ${roles}" th:value="${r.roleId}" th:text="${r.roleName}"></option>
        </select>
        <div class="error-text" th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}"></div>
      </div>

      <button class="btn" type="submit">Добавить</button>
    </form>
  </div>

  <!-- Таблица -->
  <table>
    <thead>
    <tr><th>ID</th><th>Логин</th><th>Имя</th><th>Email</th><th>Роль</th><th>Действия</th></tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
      <td th:text="${u.userId}">1</td>
      <td th:text="${u.login}">login</td>
      <td th:text="${u.name}">name</td>
      <td th:text="${u.email}">mail</td>
      <td>
        <form th:action="@{|/admin/users/${u.userId}/role|}" method="post" class="row">
          <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <select name="roleId">
            <option th:each="r : ${roles}"
                    th:value="${r.roleId}"
                    th:selected="${u.role != null and u.role.roleId == r.roleId}"
                    th:text="${r.roleName}"></option>
          </select>
          <button class="btn" type="submit">Сменить</button>
        </form>
      </td>
      <td>
        <form th:action="@{|/admin/users/${u.userId}/delete|}" method="post" onsubmit="return confirm('Удалить пользователя?')">
          <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button class="btn ghost" type="submit">Удалить</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>

  <p style="margin-top:12px"><a class="btn ghost" th:href="@{/}">← На главную</a></p>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
