<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Избранное</title>
    <th:block th:replace="~{fragments/header :: header}"></th:block>
</head>
<body>
<div class="container" style="max-width:900px;margin:20px auto">
    <h1>Избранное</h1>

    <div th:if="${#lists.isEmpty(products)}" class="muted">Пусто.</div>

    <div th:if="${!#lists.isEmpty(products)}"
         style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">
        <div class="card" th:each="p : ${products}">
            <a th:href="@{|/products/${p.productId}|}" th:text="${p.name}">Название</a>
            <div style="margin-top:8px">
                <form th:action="@{/favorites/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${p.productId}"/>
                    <button class="btn ghost" type="submit">Убрать</button>
                </form>
            </div>
        </div>
    </div>

    <div style="margin-top:12px">
        <form th:action="@{/favorites/clear}" method="post">
            <button class="btn ghost" type="submit">Очистить</button>
        </form>
    </div>
</div>
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
</body>
</html>
