<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Вход', ~{::section})}">
<section>
    <!-- Локальные стили: НЕ трогают общий .container/хедер -->
    <style>
        .login-page{padding:20px 16px;}
        .login-page .auth-wrap{max-width:420px;margin:0 auto;}
        .login-page .auth-card{
            border:1px solid #e5e7eb;border-radius:12px;background:#fff;padding:20px;
            box-shadow:0 4px 12px rgba(0,0,0,.05);transition:transform .15s ease, box-shadow .25s ease;
        }
        .login-page .auth-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(0,0,0,.08);}
        .login-page .auth-title{margin:0 0 10px}
        .login-page .hint{color:#6b7280;font-size:14px;margin-bottom:12px}
        .login-page .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
        .login-page .field input{
            border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font:inherit;background:#fff;color:#111827;
        }
        .login-page .field input:focus{outline:0;border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.2)}
        .login-page .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:8px;
            padding:10px 14px;border-radius:10px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer;
            transition:.15s;
        }
        .login-page .btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.15);}
        .login-page .btn:disabled{opacity:.6;cursor:not-allowed}
        .login-page .error,.login-page .success{border-radius:10px;padding:10px 12px;margin:0 0 12px}
        .login-page .error{background:#fee2e2;border:1px solid #ef4444;color:#7f1d1d}
        .login-page .success{background:#dcfce7;border:1px solid #22c55e;color:#14532d}
        .login-page .links{margin-top:12px;font-size:14px}
        .login-page .links a{color:#111827;text-decoration:none}
        .login-page .links a:hover{text-decoration:underline}

        /* Адаптив — доп. отступы на маленьких экранах */
        @media (max-width: 480px){
            .login-page{padding:16px 12px;}
            .login-page .auth-card{padding:16px;}
        }
    </style>

    <!-- ТЁМНАЯ ТЕМА: те же цвета, что на каталоге/товаре/корзине -->
    <style>
        /* Общий фон/текст — фон страницы задаёт layout/хедер; здесь карточка/поля/текст */
        body.dark .login-page .auth-card{
            background:#0f172a !important;
            border-color:rgba(148,163,184,.22) !important;
            box-shadow:0 8px 24px rgba(0,0,0,.45);
            color:#e5e7eb;
        }
        body.dark .login-page .auth-title{color:#e5e7eb;}
        body.dark .login-page .hint{color:#a3a3a3;}

        body.dark .login-page .field input{
            background:#0b1220;color:#e5e7eb;border-color:rgba(148,163,184,.28);
        }
        body.dark .login-page .field input:focus{
            border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.25);
        }

        body.dark .login-page .btn{
            background:#111827;border-color:#111827;color:#fff;
        }
        body.dark .login-page .btn:hover{
            box-shadow:0 10px 22px rgba(0,0,0,.35);
        }

        body.dark .login-page .error{
            background:#3b0a0a;border-color:#7f1d1d;color:#fee2e2;
        }
        body.dark .login-page .success{
            background:#052e1f;border-color:#166534;color:#d1fae5;
        }

        body.dark .login-page .links a{color:#c4b5fd;}
        body.dark .login-page .links a:hover{color:#ddd6fe;}
    </style>

    <!-- (опционально) моментально применяем сохранённую тему, если layout ещё не сделал -->
    <script>
        (function(){try{
            if(localStorage.getItem('theme')==='dark') document.body.classList.add('dark');
        }catch(e){}})();
    </script>

    <div class="login-page">
        <div class="auth-wrap">
            <div class="auth-card" role="region" aria-labelledby="loginTitle">
                <h1 id="loginTitle" class="auth-title">Вход</h1>
                <p class="hint">Введите логин и пароль, чтобы продолжить.</p>

                <div th:if="${param.error}" class="error">Неверный логин или пароль.</div>
                <div th:if="${param.registered}" class="success">Регистрация успешна — войдите.</div>

                <form th:action="@{/login}" method="post" novalidate>
                    <!-- CSRF (если объект есть) -->
                    <input th:if="${_csrf != null}"
                           type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <label class="field">
                        <span>Логин</span>
                        <!-- если в Security не меняли параметр — поставьте name="username" -->
                        <input type="text" name="login" autocomplete="username" required />
                    </label>

                    <label class="field">
                        <span>Пароль</span>
                        <input type="password" name="password" autocomplete="current-password" required />
                    </label>

                    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px">
                        <button type="submit" class="btn">Войти</button>
                        <!-- можно добавить «Забыли пароль?» при наличии маршрута -->
                        <!-- <a th:href="@{/password/restore}" class="links">Забыли пароль?</a> -->
                    </div>
                </form>

                <div class="links">
                    Нет аккаунта?
                    <a th:href="@{/register}">Регистрация</a>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
