<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Вход', ~{::section})}">
<section>
    <!-- локальные стили -->
    <style>
        .auth-wrap{max-width:420px;margin:0 auto}
        .auth-card{border:1px solid #ddd;border-radius:12px;background:#fff;padding:18px}
        .auth-title{margin:0 0 10px}
        .hint{color:#6b7280;font-size:14px;margin-bottom:12px}
        .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
        .field input{border:1px solid #d1d5db;border-radius:8px;padding:10px 12px;font:inherit;background:#fff}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:10px;
            border:1px solid #111827;background:#111827;color:#fff;cursor:pointer}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .error,.success{border-radius:10px;padding:10px 12px;margin:0 0 12px}
        .error{background:#fee2e2;border:1px solid #ef4444;color:#7f1d1d}
        .success{background:#dcfce7;border:1px solid #22c55e;color:#14532d}
        .links{margin-top:12px;font-size:14px}
        .links a{color:#111827}
    </style>

    <div class="auth-wrap">
        <div class="auth-card">
            <h1 class="auth-title">Вход</h1>
            <p class="hint">Введите логин и пароль, чтобы продолжить.</p>

            <div th:if="${param.error}" class="error">Неверный логин или пароль.</div>
            <div th:if="${param.registered}" class="success">Регистрация успешна — войдите.</div>

            <form th:action="@{/login}" method="post" novalidate>
                <!-- CSRF: добавляем только если объект есть, иначе Thymeleaf упадёт на null -->
                <input th:if="${_csrf != null}"
                       type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <label class="field">
                    <span>Логин</span>
                    <!-- если не менял конфиг, в Security задай usernameParameter(\"login\"); иначе используй name=\"username\" -->
                    <input type="text" name="login" autocomplete="username" required />
                </label>

                <label class="field">
                    <span>Пароль</span>
                    <input type="password" name="password" autocomplete="current-password" required />
                </label>

                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px">

                    <button type="submit" class="btn">Войти</button>
                </div>
            </form>

            <div class="links">
                Нет аккаунта?
                <a th:href="@{/register}">Регистрация</a>
            </div>
        </div>
    </div>
</section>
</html>
