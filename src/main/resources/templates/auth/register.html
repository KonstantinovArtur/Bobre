<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout('Регистрация', ~{::section})">
<section>
    <h1>Регистрация</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form th:action="@{/register}" method="post" th:object="${form}">
        <label>Логин
            <input type="text" th:field="*{login}" required>
            <span th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></span>
        </label><br/>

        <label>Email
            <input type="email" th:field="*{email}" required>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label><br/>

        <label>Имя
            <input type="text" th:field="*{name}">
        </label><br/>

        <label>Пароль
            <input type="password" th:field="*{password}" required>
            <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label><br/>

        <label>Повторите пароль
            <input type="password" th:field="*{confirm}" required>
            <span th:if="${#fields.hasErrors('confirm')}" th:errors="*{confirm}"></span>
        </label><br/>

        <button type="submit">Создать аккаунт</button>
    </form>

    <p>Уже есть аккаунт? <a th:href="@{/login}">Войти</a></p>
</section>
</html>
